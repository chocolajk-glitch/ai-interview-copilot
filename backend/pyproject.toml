[project]
name = "ai-interview-copilot-backend"
version = "0.1.0"
description = "AI 面试助手后端"
authors = [
    {name = "YourName"}
]
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn[standard] (>=0.49.0,<0.50.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "langchain (>=1.3.4,<2.0.0)",
    "langchain-core (>=1.4.0,<2.0.0)",
    "langchain-community (>=0.3.0,<0.4.0)",
    "langchain-deepseek (>=1.1.0,<2.0.0)",
    "langchain-openai (>=1.2.2,<2.0.0)",
    "langchain-text-splitters (>=1.1.2,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "dashscope (>=1.25.21,<2.0.0)",
    "sentence-transformers (>=5.5.1,<6.0.0)",
    "rank-bm25 (>=0.2.2,<0.3.0)",
    "flagembedding (>=1.4.0,<2.0.0)",
    "ragas (>=0.4.0,<0.5.0)",
    "langchain-google-vertexai (>=3.0.0,<4.0.0)",
    "datasets (>=2.14.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]
[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"  # 自动识别 async def test_*（不加装饰器）

[tool.poetry.dependencies]
langgraph = "^0.3.0"